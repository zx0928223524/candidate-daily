name: 探測查核來源
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p probe && python scripts/probe.py
      - run: |
          git config user.name "candidate-daily bot"
          git config user.email "bot@users.noreply.github.com"
          git add probe && git commit -m "探測結果" && git push
