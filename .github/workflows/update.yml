name: 每日更新

on:
  schedule:
    - cron: "0 23 * * *"   # 世界標準時間 23:00 = 台灣時間每天早上 7:00
  workflow_dispatch:        # 也可以手動按一下立刻更新

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 蒐集新聞與公開資料
        run: python scripts/update.py
      - name: 有變動才存檔
        run: |
          git config user.name "candidate-daily bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "沒有變動"
          else
            git commit -m "每日更新 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
          fi
